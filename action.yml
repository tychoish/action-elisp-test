name: "Emacs Lisp Test Runner"
description: "Run ERT or ELPAish test suites with automatic archive and dependency bootstrapping."
author: "sam kleinman <sam@tychoish.com>"

inputs:
  dependencies:
    description: "Whitespace or comma-separated list of ELPA packages to install."
    required: false
    default: ""
  test-files:
    description: "Glob or whitespace-separated list of ERT test files to run."
    required: false
    default: "test/test-*.el"
  load-paths:
    description: "Whitespace-separated list of directories to add to load-path."
    required: false
    default: "."
  archives:
    description: "Package archives to enable (gnu, nongnu, melpa, elpaish)."
    required: false
    default: "gnu nongnu melpa elpaish"
  unsigned-archives:
    description: "Package archives allowed without GPG signatures."
    required: false
    default: "elpaish"
  runner:
    description: "Test runner strategy (ert or elpaish)."
    required: false
    default: "ert"

runs:
  using: "composite"
  steps:
    - name: Run Emacs Lisp Tests
      shell: bash
      env:
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
        INPUT_TEST_FILES: ${{ inputs.test-files }}
        INPUT_LOAD_PATHS: ${{ inputs.load-paths }}
        INPUT_ARCHIVES: ${{ inputs.archives }}
        INPUT_UNSIGNED_ARCHIVES: ${{ inputs.unsigned-archives }}
        INPUT_RUNNER: ${{ inputs.runner }}
      run: |
        emacs --batch -l "${{ github.action_path }}/scripts/run-ert.el"
