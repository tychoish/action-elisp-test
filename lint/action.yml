name: "Emacs Lisp Linter"
description: "Run byte-compilation, checkdoc, package-lint, and relint across Emacs Lisp source files."
author: "sam kleinman <sam@tychoish.com>"

inputs:
  dependencies:
    description: "ELPA packages to install (YAML list or list of strings)."
    required: false
    default: ""
  target-files:
    description: "Source files or globs to lint (YAML list or list of strings)."
    required: false
    default: "*.el"
  load-paths:
    description: "Directories to prepend to load-path (YAML list or list of strings)."
    required: false
    default: "."
  linters:
    description: "Active linters: byte-compile, checkdoc, package-lint, relint (YAML list or list of strings)."
    required: false
    default: "byte-compile checkdoc"
  required-linters:
    description: "Linters whose errors or warnings will fail the CI step (YAML list or list of strings)."
    required: false
    default: "byte-compile checkdoc"
  fail-on-warning:
    description: "Treat compiler warnings as fatal errors (true/false)."
    required: false
    default: "true"
  archives:
    description: "Package archives to enable (YAML list or list of strings)."
    required: false
    default: "gnu nongnu melpa elpaish"
  unsigned-archives:
    description: "Package archives allowed without GPG signatures (YAML list or list of strings)."
    required: false
    default: "elpaish"
  keyring-url:
    description: "URL to fetch GPG keyring."
    required: false
    default: "https://tychoish.github.io/elpaish/elpaish-keyring.gpg"

runs:
  using: "composite"
  steps:
    - name: Run Emacs Lisp Linting
      shell: bash
      env:
        INPUT_DEPENDENCIES: ${{ inputs.dependencies }}
        INPUT_TARGET_FILES: ${{ inputs.target-files }}
        INPUT_LOAD_PATHS: ${{ inputs.load-paths }}
        INPUT_LINTERS: ${{ inputs.linters }}
        INPUT_REQUIRED_LINTERS: ${{ inputs.required-linters }}
        INPUT_FAIL_ON_WARNING: ${{ inputs.fail-on-warning }}
        INPUT_ARCHIVES: ${{ inputs.archives }}
        INPUT_UNSIGNED_ARCHIVES: ${{ inputs.unsigned-archives }}
        INPUT_KEYRING_URL: ${{ inputs.keyring-url }}
      run: |
        SCRIPT_PATH="${{ github.action_path }}/../scripts/run-lint.el"
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="/__w/${SCRIPT_PATH#/home/runner/work/}"
        fi
        if [ ! -f "$SCRIPT_PATH" ] && [ -n "${GITHUB_ACTION_PATH:-}" ]; then
          SCRIPT_PATH="${GITHUB_ACTION_PATH}/../scripts/run-lint.el"
        fi
        if [ ! -f "$SCRIPT_PATH" ]; then
          SCRIPT_PATH="${GITHUB_WORKSPACE}/scripts/run-lint.el"
        fi
        emacs --batch -l "$SCRIPT_PATH"
